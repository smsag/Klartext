# Publish a release of the theme: Actions → Release → Run workflow, with the
# version to release. Obsidian's convention: the tag is the bare version
# (2.1.0, not v2.1.0), and the release carries theme.css and manifest.json.
#
# It refuses, before anything is published, unless:
#   - every check CI runs passes (this calls .github/workflows/ci.yml): the
#     guards, stylelint, and a theme.css that fonts/embed.py builds unchanged;
#   - it runs on the default branch;
#   - the version is x.y.z, equals manifest.json's, and has no tag yet;
#   - CHANGELOG.md has a non-empty "## [x.y.z]" section, which becomes the notes.
#
# Only the publishing job can write to the repository, and it runs no
# third-party package: the checks, which fetch stylelint from npm, run with a
# read-only token.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in manifest.json (for example 2.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run on the default branch only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are cut from $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Version is x.y.z, matches manifest.json, and is not tagged yet
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not x.y.z (Obsidian tags carry no v)."
            exit 1
          fi
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::manifest.json says $manifest, not $VERSION. Bump it on $GITHUB_REF_NAME first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: node tools/release-notes.mjs "$VERSION" "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" theme.css manifest.json \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
