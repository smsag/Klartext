# Cut a Klartext release.
#
# The theme has no build and no test suite: what ships is `theme.css` and
# `manifest.json`, both committed. So this workflow does not produce the
# release's contents — it publishes them, and checks the two things that are
# easy to get wrong by hand and impossible to see afterwards:
#
#   1. the tag and manifest.json must name the same version, because Obsidian
#      reads the manifest and would install the release as the wrong thing;
#   2. theme.css must be what `fonts/embed.py` produces from `src/theme.css`,
#      because the shipped file is generated and a stale one is a stylesheet
#      nobody wrote.
#
# Run it from the Actions tab with the version as input, after the version
# bump and the CHANGELOG entry are on main.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match manifest.json, e.g. 1.6.2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Read into the environment once and used as "$VERSION" from there: a
    # dispatch input is a person's typing, and expanded into a shell line it
    # would run as the workflow's own text.
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the manifest
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version \"$VERSION\" is not a release number."; exit 1 ;;
          esac
          manifest=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$VERSION" != "$manifest" ]; then
            echo "Input $VERSION, manifest.json $manifest: these must agree."
            exit 1
          fi

      - name: Check theme.css is what embed.py builds from src/theme.css
        run: |
          cp theme.css theme.css.shipped
          python3 fonts/embed.py
          if ! diff -q theme.css.shipped theme.css > /dev/null; then
            echo "theme.css differs from what fonts/embed.py produces — run it and commit the result."
            exit 1
          fi
          rm theme.css.shipped

      # Only this version's section of the changelog, not the whole file.
      - name: Extract the release notes
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "A release for $VERSION already exists — bump the version first."
            exit 1
          fi
          gh release create "$VERSION" \
            --title "Klartext $VERSION" \
            --notes-file release_notes.md \
            theme.css manifest.json
